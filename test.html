<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="test.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h2>My Profile</h2>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>


    <!-- Hero -->
    <section class="hero">

        <div class="hero-text">
            <h1>Hello, I'm Tawit</h1>
            <p>Welcome to my website</p>
            <button>Learn More</button>
        </div>

        <div class="hero-image">
            <img src="image.jpg" alt="profile">
        </div>

    </section>


    <!-- Form -->
    <section class="form-section">

        <h2>Register</h2>

        <form>

            <label>Name</label>
            <input type="text"
                   placeholder="Enter your name"
                   required>

            <label>Email</label>
            <input type="email"
                   placeholder="Enter your email"
                   required>

            <p>Gender</p>

            <label>
                <input type="radio" name="gender">
                Male
            </label>

            <label>
                <input type="radio" name="gender">
                Female
            </label>

            <button type="submit">Submit</button>

        </form>

    </section>


    <!-- Card -->
    <section class="cards">

        <div class="card">
            <h3>Card 1</h3>
            <p>This is card one.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <h3>Card 2</h3>
            <p>This is card two.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <h3>Card 3</h3>
            <p>This is card three.</p>
            <button>Read More</button>
        </div>

    </section>

</body>
</html>
