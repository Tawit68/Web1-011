 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Responsive -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <link rel="stylesheet" href="test2.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h2>Logo</h2>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>


    <!-- Hero -->
    <section class="hero">

        <div>
            <h1>Hello</h1>
            <p>Welcome to my website</p>
            <button>Click</button>
        </div>

        <img src="image.jpg" alt="image">

    </section>


    <!-- Form -->
    <section class="form">

        <h2>Register</h2>

        <input type="text"
               placeholder="Name"
               required>

        <input type="email"
               placeholder="Email"
               required>

        <label>
            <input type="radio" name="gender">
            Male
        </label>

        <label>
            <input type="radio" name="gender">
            Female
        </label>

        <button type="submit">
            Submit
        </button>

    </section>


    <!-- Cards -->
    <section class="cards">

        <div class="card">
            <h3>Card 1</h3>
            <p>Text</p>
        </div>

        <div class="card">
            <h3>Card 2</h3>
            <p>Text</p>
        </div>

        <div class="card">
            <h3>Card 3</h3>
            <p>Text</p>
        </div>

    </section>

</body>
</html>
